networks:
  net-r0-host:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  net-r0-r1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24

  net-r1-r2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24

  net-r2-s0:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.3.0/24

  net-r2-s1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.4.0/24

volumes:
  xia-shared:

services:

  # ------------------------------------------------------------
  # Router 1 (backbone / nameserver)
  # ------------------------------------------------------------

  router1:
    build: .
    image: xia-core:v2
    platform: linux/amd64
    container_name: router1
    hostname: router1
    privileged: true
    tty: true
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - XIA_NAMESERVER=1
    networks:
      net-r0-r1:
        ipv4_address: 172.20.1.2
      net-r1-r2:
        ipv4_address: 172.20.2.2
    volumes:
      - xia-shared:/shared
    command: [ "/opt/xia-core/scripts/start-router.sh" ]

  # ------------------------------------------------------------
  # Router 0 (AD0 <-> AD1)
  # ------------------------------------------------------------

  router0:
    build: .
    image: xia-core:v2
    platform: linux/amd64
    container_name: router0
    hostname: router0
    privileged: true
    tty: true
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      - router1
    environment:
      - XIA_PEER_HOSTS=host0
      - XIA_NAMESERVER=0
    networks:
      net-r0-host:
        ipv4_address: 172.20.0.2
      net-r0-r1:
        ipv4_address: 172.20.1.3
    volumes:
      - xia-shared:/shared
    command: [ "/opt/xia-core/scripts/start-router.sh" ]

  # ------------------------------------------------------------
  # Router 2 (AD1 <-> AD2)
  # ------------------------------------------------------------

  router2:
    build: .
    image: xia-core:v2
    platform: linux/amd64
    container_name: router2
    hostname: router2
    privileged: true
    tty: true
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      - router1
    environment:
      - XIA_PEER_HOSTS=server0 server1
      - XIA_NAMESERVER=0
    networks:
      net-r1-r2:
        ipv4_address: 172.20.2.3
      net-r2-s0:
        ipv4_address: 172.20.3.2
      net-r2-s1:
        ipv4_address: 172.20.4.2
    volumes:
      - xia-shared:/shared
    command: [ "/opt/xia-core/scripts/start-router.sh" ]

  # ------------------------------------------------------------
  # Host 0 (AD0)
  # ------------------------------------------------------------

  host0:
    build: .
    image: xia-core:v2
    platform: linux/amd64
    container_name: host0
    hostname: host0
    privileged: true
    tty: true
    depends_on:
      - router0
    environment:
      - XIA_PEER_HOSTS=host0 server0 server1
    networks:
      net-r0-host:
        ipv4_address: 172.20.0.10
    volumes:
      - xia-shared:/shared
    command: [ "/opt/xia-core/scripts/start-node.sh" ]

  # ------------------------------------------------------------
  # Server 0 (AD2)
  # ------------------------------------------------------------

  server0:
    build: .
    image: xia-core:v2
    platform: linux/amd64
    container_name: server0
    hostname: server0
    privileged: true
    tty: true
    depends_on:
      - router2
    environment:
      - XIA_PEER_HOSTS=host0 server0 server1
    networks:
      net-r2-s0:
        ipv4_address: 172.20.3.10
    volumes:
      - xia-shared:/shared
    command: [ "/opt/xia-core/scripts/start-node.sh" ]

  # ------------------------------------------------------------
  # Server 1 (AD2)
  # ------------------------------------------------------------

  server1:
    build: .
    image: xia-core:v2
    platform: linux/amd64
    container_name: server1
    hostname: server1
    privileged: true
    tty: true
    depends_on:
      - router2
    environment:
      - XIA_PEER_HOSTS=host0 server0 server1
    networks:
      net-r2-s1:
        ipv4_address: 172.20.4.10
    volumes:
      - xia-shared:/shared
    command: [ "/opt/xia-core/scripts/start-node.sh" ]
