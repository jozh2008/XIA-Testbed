# Topology (mirrors the example network in the xia-core wiki):
#
#   host0 --- router0 --- router1 --- router2 --- server0
#                                          \------- server1
#
# router1 hosts the XIA nameserver (there can only be one per network).

x-xia-common: &xia-common
  build: .
  cap_add:
    - NET_ADMIN
    - NET_RAW
  volumes:
    - resolv-share:/shared

services:
  host0:
    <<: *xia-common
    container_name: host0
    environment:
      ROLE: host
    networks:
      - net-h0-r0

  router0:
    <<: *xia-common
    container_name: router0
    environment:
      ROLE: router
      NAMESERVER: "false"
    networks:
      - net-h0-r0
      - net-r0-r1

  router1:
    <<: *xia-common
    container_name: router1
    environment:
      ROLE: router
      NAMESERVER: "true"
    networks:
      - net-r0-r1
      - net-r1-r2

  router2:
    <<: *xia-common
    container_name: router2
    environment:
      ROLE: router
      NAMESERVER: "false"
    networks:
      - net-r1-r2
      - net-r2-s0
      - net-r2-s1

  server0:
    <<: *xia-common
    container_name: server0
    environment:
      ROLE: host
    networks:
      - net-r2-s0

  server1:
    <<: *xia-common
    container_name: server1
    environment:
      ROLE: host
    networks:
      - net-r2-s1

networks:
  net-h0-r0:
    internal: true
  net-r0-r1:
    internal: true
  net-r1-r2:
    internal: true
  net-r2-s0:
    internal: true
  net-r2-s1:
    internal: true

volumes:
  resolv-share:
